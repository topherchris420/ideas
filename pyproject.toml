[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-os"
version = "0.1.0"
description = "Importable safe core models and CLI for the hello_os research playground."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Christopher Woodyard" }
]
dependencies = [
  "numpy>=1.22"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]

[project.scripts]
hello-os = "hello_os.cli:main"

[tool.setuptools]
packages = ["hello_os"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
