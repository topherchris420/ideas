<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #161826; }
    a { color: #b5abfc; }
    a:hover { color: #d2cefd; }
  </style>
  <script>window.OM_SCENES = '[{"name":"Opening","dur":4.5},{"name":"Idea","dur":5.5},{"name":"Materials","dur":7},{"name":"Safety","dur":5.5},{"name":"Detector","dur":6.5},{"name":"Payoff","dur":5.5}]';</script>
  <script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
  <script>window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "motionEditor": true,
    "accent": "#5fd08a",
    "material": "Silicon Nitride",
    "captions": true
  }/*EDITMODE-END*/;</script>
</helmet>
<div data-screen-label="00:00" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#161826">
  <x-import
    component-from-global-scope="HelloOSVideo"
    from="./animations-v2.jsx ./tweaks-panel.jsx ./hello-os-video.jsx"
    scenes="{{ scenes }}"
    playback="{{ playback }}"
    hint-size="100%,100%">
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      scenes: window.OM_SCENES,
      playback: window.OM_PLAYBACK,
    };
  }
}
</script>
</body>
</html>
